name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ui:
    name: Console DOM checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.4"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov-report=xml
      - run: uv run python scripts/evaluate.py
      - run: uv build

  container:
    name: Container and HTTP smoke check
    needs: [test, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.4"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: docker compose config --quiet
      - run: docker build --tag supportforge:test .
      - name: Run with production-like restrictions
        run: >-
          docker run -d --name supportforge --read-only --cap-drop ALL
          --security-opt no-new-privileges:true --tmpfs /tmp:rw,size=64m,mode=1777
          -v supportforge-ci:/app/data -p 127.0.0.1:8000:8000 supportforge:test
      - name: Wait for readiness and check lifecycle
        run: |
          ready=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          uv run python scripts/smoke.py http://127.0.0.1:8000
      - name: Container logs
        if: always()
        run: docker logs supportforge || true
      - name: Clean up
        if: always()
        run: docker rm -f supportforge || true
