[build-system]
requires = ["hatchling==1.30.0"]
build-backend = "hatchling.build"

[project]
name = "supportforge"
version = "0.1.0"
description = "Evidence-backed support workflows with Semantic Kernel, Docker, and GitHub Actions."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "semantic-kernel==1.46.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "pytest-cov==7.1.0",
  "ruff==0.17.3",
  "build==1.6.1",
  "socksio==1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/supportforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=supportforge --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
